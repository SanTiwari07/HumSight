<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HumSight Demo Film</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#0b1020; --bg2:#121a33; --panel:#18213f; --line:#2a3560; --ink:#eef2ff; --ink2:#a9b3d6; --ink3:#7381b3;
  --amber:#f5b400; --blue:#4c8dff; --red:#ff5a5f; --green:#3ccf8e; --violet:#9b7bff; --aws:#ff9900;
  --sans:"Segoe UI Variable Display","Segoe UI",Inter,Arial,sans-serif; --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:var(--ink);font-family:var(--sans);overflow:hidden}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);transform-origin:center center;flex:none}
.scene{position:absolute;inset:0;display:none;background:radial-gradient(1200px 700px at 70% 20%,#1a2550 0%,var(--bg) 60%)}
.scene.rec{background:#f3f4f7}
.abs{position:absolute}
.fill{position:absolute;inset:0}
.h1{font-size:76px;font-weight:700;letter-spacing:-1.5px;line-height:1.05}
.h2{font-size:54px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.h3{font-size:34px;font-weight:600}
.muted{color:var(--ink2)}
.mono{font-family:var(--mono)}
.chip{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:26px;font-family:var(--mono);color:var(--ink);white-space:nowrap}
.chip.amber{border-color:#7a5c00;background:#2d2408;color:#ffd659}
.chip.red{border-color:#7a2427;background:#2e1012;color:#ff8f92}
.chip.green{border-color:#1d6b4b;background:#0d2a20;color:#7ff0bd}
.chip.blue{border-color:#264d99;background:#0f1d3d;color:#9cc0ff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px}
.tag{font-family:var(--mono);font-size:20px;color:var(--ink3);letter-spacing:.5px}

/* overlay chrome */
#chapter{position:absolute;left:48px;top:40px;transition:none;z-index:50;padding:10px 20px;border-radius:999px;background:rgba(8,12,28,.82);border:1px solid rgba(255,255,255,.14);font-size:24px;font-weight:600;letter-spacing:.3px;color:#fff;opacity:0}
#chapter b{color:var(--amber);font-weight:700}
#brand{position:absolute;right:48px;top:40px;z-index:50;font-size:24px;font-weight:700;color:#fff;padding:10px 18px;border-radius:999px;background:rgba(8,12,28,.82);border:1px solid rgba(255,255,255,.14);opacity:0}
#brand span{color:var(--amber)}
#cap{display:none;position:absolute;left:50%;bottom:58px;transform:translateX(-50%);z-index:60;max-width:1560px;text-align:center;font-size:36px;line-height:1.3;font-weight:600;color:#fff;padding:12px 26px;border-radius:14px;background:rgba(5,8,18,.84);opacity:0}
#prog{position:absolute;left:0;bottom:0;height:6px;background:var(--amber);z-index:60}
#progbg{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.1);z-index:59}
#fade{position:absolute;inset:0;background:#000;z-index:80;pointer-events:none;opacity:0}

/* recording scenes */
.recimg{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.callout{position:absolute;z-index:20;padding:18px 26px;border-radius:18px;background:rgba(8,12,28,.92);color:#fff;font-size:32px;font-weight:600;box-shadow:0 18px 50px rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.12);opacity:0}
.callout.red{border-color:var(--red)}
.callout.amber{border-color:var(--amber)}
.callout small{display:block;font-size:22px;font-weight:500;color:var(--ink2);margin-top:4px}
.ff{position:absolute;right:48px;top:110px;z-index:21;padding:14px 22px;border-radius:14px;background:rgba(8,12,28,.92);color:#fff;font-size:28px;font-weight:700;opacity:0}
.ff .clock{font-family:var(--mono);color:var(--amber)}
.ring{position:absolute;z-index:19;border:5px solid var(--amber);border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.0);opacity:0}

/* cold open */
.vidpair{position:absolute;left:80px;right:80px;top:170px;display:flex;gap:40px}
.vid{flex:1;position:relative}
.vid img{width:860px;height:484px;display:block;border-radius:18px;border:2px solid #2a3560;image-rendering:auto}
.vid .lbl{margin-top:18px;font-size:30px;font-weight:700;letter-spacing:1px}
.vid .lbl span{font-weight:500;color:var(--ink2);letter-spacing:0}

/* title */
.wave{position:absolute;left:50%;top:250px;transform:translateX(-50%)}
.logo{position:absolute;left:0;right:0;top:420px;text-align:center;font-size:150px;font-weight:800;letter-spacing:-4px}
.logo span{color:var(--amber)}
.tagline{position:absolute;left:0;right:0;top:600px;text-align:center;font-size:44px;color:var(--ink2)}
.strip{position:absolute;left:0;right:0;top:700px;display:flex;justify-content:center;align-items:center;gap:28px}
.step{display:flex;align-items:center;gap:16px;padding:18px 26px;border-radius:18px;background:var(--panel);border:1px solid var(--line);font-size:30px;font-weight:600;opacity:0}
.arrow{font-size:40px;color:var(--ink3);opacity:0}
.foot{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-size:24px;color:var(--ink3);letter-spacing:.4px}

/* grids of cards */
.row{position:absolute;display:flex;gap:28px}
.ucard{width:400px;padding:34px 30px;opacity:0}
.ucard svg{width:72px;height:72px;margin-bottom:20px}
.ucard h4{font-size:32px;margin-bottom:12px}
.ucard p{font-size:24px;color:var(--ink2);line-height:1.35}

/* agent */
.steps{position:absolute;left:90px;top:200px;width:620px}
.st{display:flex;align-items:center;gap:18px;padding:13px 18px;margin-bottom:12px;border-radius:16px;border:1px solid transparent;opacity:.25}
.st .n{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:22px;flex:none}
.st .t{font-size:30px;font-weight:600}
.st .tool{font-family:var(--mono);font-size:20px;color:var(--ink3)}
.st.on{opacity:1}
.st.cur{background:var(--panel);border-color:var(--line)}
.st.cur .n{background:var(--amber);color:#111;border-color:var(--amber)}
.detail{position:absolute;left:780px;top:200px;width:1050px;height:600px;padding:56px 60px}
.detail .kicker{font-family:var(--mono);font-size:26px;color:var(--amber);letter-spacing:1px;margin-bottom:12px}
.detail .ttl{font-size:68px;font-weight:700;margin-bottom:30px;letter-spacing:-1px}
.detail .why{font-size:38px;color:var(--ink2);line-height:1.38;margin-bottom:44px}
.detail .why b{color:var(--ink)}
.detail .chips{display:flex;flex-wrap:wrap;gap:16px}.detail .chip{font-size:32px;padding:14px 24px}
.svgwrap{position:absolute;background:#fbf9f5;border-radius:22px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.svgwrap img{display:block;width:100%;height:auto}
.svgwrap .src{position:absolute;right:20px;bottom:-44px;font-family:var(--mono);font-size:20px;color:var(--ink3)}

/* aws */
#awsSvg{position:absolute;left:0;top:0}
.node rect{fill:var(--panel);stroke:var(--line);stroke-width:2}
.node text{fill:var(--ink);font-family:var(--sans)}
.node .sub{fill:var(--ink2);font-size:21px}
.node .ttl{font-size:30px;font-weight:700}
.node{transition:none}
.pkt rect{fill:var(--amber)}
.pkt text{fill:#111;font-family:var(--mono);font-size:21px;font-weight:700}
.edge{stroke:#34406e;stroke-width:3;fill:none}

/* results */
.bar{position:absolute;left:0;height:64px;border-radius:12px}
.tile{width:520px;padding:30px 34px;opacity:0}
.tile .big{font-size:64px;font-weight:800;letter-spacing:-1px}
.tile .lab{font-size:26px;color:var(--ink2);margin-top:6px}

/* controls (interactive mode only) */
#ctl{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:100;display:flex;gap:12px;align-items:center;padding:10px 16px;border-radius:14px;background:rgba(20,24,40,.92);color:#fff;font:14px system-ui}
#ctl button{background:#f5b400;color:#111;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
#ctl input{width:420px}
#ctl select{background:#222a44;color:#fff;border:1px solid #39456f;border-radius:8px;padding:6px}
body.render #ctl{display:none}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div id="chapter"></div>
  <div id="brand"><span>〰</span> HumSight</div>
  <div id="cap"></div>
  <div id="progbg"></div><div id="prog"></div>
  <div id="fade"></div>
</div></div>
<div id="ctl">
  <button id="pp">Play</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Seek">
  <span id="clock" style="font-family:monospace">0:00</span>
  <select id="jump" aria-label="Jump to scene"></select>
</div>
<audio id="aud" src="narration.wav" preload="auto"></audio>

<script src="timing.js"></script>
<script src="recindex.js"></script>
<script>
"use strict";
const T = window.TIMING, REC = window.REC;
const $ = (s, r = document) => r.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => (x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
const prog = (lt, a, b) => ease(clamp((lt - a) / Math.max(1e-6, b - a)));
const lerp = (a, b, k) => a + (b - a) * k;
const stage = $("#stage");
function el(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; }
function sayAt(sc, phrase) {
  const i = sc.text.indexOf(phrase);
  if (i < 0) console.warn("phrase not found", sc.id, phrase);
  return sc.voStart + sc.voDur * (Math.max(0, i) / sc.text.length);
}
// piecewise-linear map from scene time to recording time
function pw(keys, lt) {
  if (lt <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (lt <= keys[i][0]) {
    const [a, x] = keys[i - 1], [b, y] = keys[i]; return lerp(x, y, (lt - a) / Math.max(1e-6, b - a));
  }
  return keys[keys.length - 1][1];
}
function recFrame(seg, rt) {
  const R = REC[seg], ts = R.t; let lo = 0, hi = ts.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (ts[m] <= rt) lo = m; else hi = m - 1; }
  return `rec/${seg}/${R.f[lo]}`;
}
function setSrc(img, src, waits) { if (img.getAttribute("src") !== src) { img.setAttribute("src", src); waits.push(img.decode().catch(() => {})); } }
function show(node, k, dy = 24) { node.style.opacity = k; node.style.transform = `translateY(${(1 - k) * dy}px)`; }
// camera: zoom s toward focus (fx, fy) in 1920x1080 space, clamped to the frame
function cam(img, s, fx, fy) {
  let tx = 960 - fx * s, ty = 540 - fy * s;
  tx = clamp(tx, 1920 - 1920 * s, 0); ty = clamp(ty, 1080 - 1080 * s, 0);
  img.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
}
function camKeys(keys, lt) { // keys: [t, s, fx, fy]
  let a = keys[0], b = keys[keys.length - 1];
  for (let i = 1; i < keys.length; i++) if (lt <= keys[i][0]) { a = keys[i - 1]; b = keys[i]; break; }
  if (lt >= keys[keys.length - 1][0]) a = b;
  const k = a === b ? 1 : ease(clamp((lt - a[0]) / (b[0] - a[0])));
  return [lerp(a[1], b[1], k), lerp(a[2], b[2], k), lerp(a[3], b[3], k)];
}
const icon = {
  wrench: '<svg viewBox="0 0 24 24" fill="none" stroke="#f5b400" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>',
  plant: '<svg viewBox="0 0 24 24" fill="none" stroke="#4c8dff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V10l5 3V10l5 3V6h4v15z"/><path d="M3 21h18M7 17h1M12 17h1M17 17h1"/></svg>',
  case: '<svg viewBox="0 0 24 24" fill="none" stroke="#3ccf8e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg>',
  cap: '<svg viewBox="0 0 24 24" fill="none" stroke="#9b7bff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5M22 9v6"/></svg>',
  phone: '<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#f5b400" stroke-width="1.7"><rect x="7" y="2" width="10" height="20" rx="2"/><circle cx="12" cy="18" r="1"/></svg>',
  grid: '<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#4c8dff" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>',
  q: '<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#3ccf8e" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg>',
};
function machine(on) {
  const c = on ? "#3ccf8e" : "#3a466f";
  return `<svg width="130" height="120" viewBox="0 0 130 120"><rect x="10" y="40" width="80" height="54" rx="10" fill="#18213f" stroke="${on ? "#3ccf8e" : "#3a466f"}" stroke-width="3" ${on ? "" : 'stroke-dasharray="7 6"'}/>
    <circle cx="50" cy="67" r="17" fill="none" stroke="#5d6ba0" stroke-width="3"/><path d="M50 52v30M35 67h30" stroke="#5d6ba0" stroke-width="3"/>
    <rect x="90" y="56" width="26" height="22" rx="4" fill="#18213f" stroke="#5d6ba0" stroke-width="3"/><path d="M10 100h106" stroke="#3a466f" stroke-width="3"/>
    ${on ? '<circle cx="80" cy="34" r="11" fill="#3ccf8e"/><path d="M80 23v-10" stroke="#3ccf8e" stroke-width="3"/>' : ""}</svg>`;
}

// ------------------------------------------------------------------ scenes
const S = {};

S.cold = {
  build(r) {
    r.innerHTML = `
      <div class="abs h2" style="left:80px;top:70px" id="cTitle">This pump looks perfectly still.</div>
      <div class="vidpair">
        <div class="vid"><img id="cO"><div class="lbl">ORIGINAL <span>· what the camera saw</span></div></div>
        <div class="vid"><img id="cM"><div class="lbl" style="color:var(--amber)">HUMSIGHT <span>· motion magnified, slowed 8×</span></div>
          <div class="abs chip amber" id="cF" style="right:24px;top:24px;font-size:34px">58.5 Hz</div>
          <div class="abs chip amber" id="cA" style="right:24px;top:94px;font-size:34px">0.047 px</div></div>
      </div>
      <div class="abs tag" style="left:80px;top:745px;font-size:22px">Synthetic test clip with exact ground truth · output of the live AWS deployment</div>`;
  },
  update(r, lt, sc, w) {
    const i = (Math.floor(lt * 30) % 720) + 1, n = String(i).padStart(4, "0");
    setSrc($("#cO", r), `media/pump/original/${n}.jpg`, w);
    setSrc($("#cM", r), `media/pump/magnified_1/${n}.jpg`, w);
    $("#cTitle", r).textContent = lt < sayAt(sc, "It isn't") ? "This pump looks perfectly still." : "It isn't.";
    show($("#cF", r), prog(lt, sayAt(sc, "fifty-eight"), sayAt(sc, "fifty-eight") + .4));
    show($("#cA", r), prog(lt, sayAt(sc, "less than"), sayAt(sc, "less than") + .4));
  },
};

S.title = {
  build(r) {
    r.innerHTML = `
      <svg class="wave" width="900" height="140" viewBox="0 0 900 140"><path id="tW" fill="none" stroke="#f5b400" stroke-width="6" stroke-linecap="round"/></svg>
      <div class="logo">HumSight</div>
      <div class="tagline">See what machines are humming.</div>
      <div class="strip">
        <div class="step" id="s1">${icon.phone}Slow-motion phone video</div><div class="arrow" id="a1">→</div>
        <div class="step" id="s2">${icon.grid}Grid of virtual vibration sensors</div><div class="arrow" id="a2">→</div>
        <div class="step" id="s3">${icon.q}Real fault, or a shaky hand?</div>
      </div>
      <div class="foot">OpenCV AI Competition 2026 · Agentic Vision with OpenCV 5 · Best Use of COOL</div>`;
  },
  update(r, lt, sc) {
    let d = "";
    for (let x = 0; x <= 900; x += 6) {
      const env = Math.exp(-Math.pow((x - 450) / 230, 2));
      const y = 70 + Math.sin(x / 18 - lt * 6) * 52 * env + Math.sin(x / 7 + lt * 9) * 6 * env;
      d += (x ? "L" : "M") + x + " " + y.toFixed(1);
    }
    $("#tW", r).setAttribute("d", d);
    show($("#s1", r), prog(lt, sayAt(sc, "slow-motion"), sayAt(sc, "slow-motion") + .5));
    $("#a1", r).style.opacity = prog(lt, sayAt(sc, "grid of"), sayAt(sc, "grid of") + .4);
    show($("#s2", r), prog(lt, sayAt(sc, "grid of"), sayAt(sc, "grid of") + .5));
    $("#a2", r).style.opacity = prog(lt, sayAt(sc, "tells you"), sayAt(sc, "tells you") + .4);
    show($("#s3", r), prog(lt, sayAt(sc, "tells you"), sayAt(sc, "tells you") + .5));
  },
};

S.problem = {
  build(r) {
    let m = ""; for (let i = 0; i < 8; i++) m += `<div class="mc" style="text-align:center;opacity:0;zoom:1.45">${machine(i === 1 || i === 5)}<div class="tag" style="margin-top:4px">${i === 1 || i === 5 ? '<span style="color:#3ccf8e">sensor</span>' : "no sensor"}</div></div>`;
    r.innerHTML = `
      <div class="abs h1" id="pA" style="left:120px;top:150px;width:1700px">Machines vibrate before they fail.</div>
      <div class="abs h3 muted" id="pA2" style="left:120px;top:260px;opacity:0">Contact sensors are fitted one machine at a time, so many are never monitored.</div>
      <div class="row" id="pRow" style="left:120px;top:400px;gap:40px">${m}</div>
      <div class="fill" id="pB" style="opacity:0">
        <div class="abs h1" style="left:120px;top:150px">“Magnify all motion”…</div>
        <div class="abs h3 muted" style="left:120px;top:260px">…also magnifies the hand holding the camera.</div>
        <div class="abs card" style="left:120px;top:380px;width:760px;height:420px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px">
          <div id="pPhone" style="width:150px;height:260px;border-radius:26px;border:6px solid #f5b400;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--ink2)">REC ●</div>
          <div class="h3">Handheld phone · tiny sway</div></div>
        <div class="abs h1" style="left:930px;top:540px;color:var(--ink3)">→</div>
        <div class="abs card" style="left:1060px;top:380px;width:740px;height:420px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;border-color:#7a2427">
          <div id="pBoom" class="h1" style="color:var(--red)">FALSE ALARM</div>
          <div class="h3" style="text-align:center;width:600px">A healthy machine looks broken</div></div>
      </div>`;
  },
  update(r, lt, sc) {
    const b = sayAt(sc, "Video should help");
    const ka = 1 - prog(lt, b - .3, b + .2);
    $("#pA", r).style.opacity = ka; $("#pRow", r).style.opacity = ka; $("#pA2", r).style.opacity = Math.min(ka, prog(lt, sayAt(sc, "Contact sensors"), sayAt(sc, "Contact sensors") + .5));
    [...r.querySelectorAll(".mc")].forEach((n, i) => show(n, prog(lt, .4 + i * .12, .9 + i * .12)));
    $("#pB", r).style.opacity = prog(lt, b - .1, b + .4);
    const sh = Math.sin(lt * 2 * Math.PI * 3.5);
    $("#pPhone", r).style.transform = `translate(${sh * 12}px,${Math.cos(lt * 13) * 6}px) rotate(${sh * 3}deg)`;
    const kb = prog(lt, sayAt(sc, "Film handheld"), sayAt(sc, "Film handheld") + .5);
    $("#pBoom", r).style.opacity = .15 + .85 * kb; $("#pBoom", r).style.transform = `scale(${.85 + .15 * kb})`;
  },
};

S.users = {
  build(r) {
    const u = [["wrench", "Maintenance technicians", "A quick non-contact check of an unmonitored machine, with the phone they already carry.", "maintenance"],
      ["plant", "Plant managers", "A first screen of which machines need a real sensor or a specialist visit.", "Plant managers"],
      ["case", "Field-service engineers", "Visual evidence (video, spectrum, heatmap) to show a customer what is moving.", "Field engineers"],
      ["cap", "Students and labs", "A hands-on way to see frequency, amplitude, Nyquist and aliasing on real video.", "students"]];
    r.innerHTML = `<div class="abs h1" style="left:120px;top:150px">Who it's for</div>
      <div class="row" style="left:120px;top:330px">${u.map((x) => `<div class="card ucard" data-p="${x[3]}">${icon[x[0]]}<h4>${x[1]}</h4><p>${x[2]}</p></div>`).join("")}</div>`;
  },

    build(r) { r.innerHTML = `<img class="recimg" id="rI">` + (cfg.html || ""); },
    update(r, lt, sc, w) {

      if (cfg.over) cfg.over(r, lt, sc, rt);
    },
  };
}

      <div class="abs card" id="t4" style="left:1260px;top:250px;width:580px;padding:30px 34px;opacity:0">
        <div class="tag">COOL vs STOCK OPENCV · EC2 c8g.large · GRAVITON4</div>
        <div class="big" style="font-size:64px;font-weight:800;margin:10px 0">0.98×–1.03×</div>
        <div class="lab" style="font-size:26px;color:var(--ink2)">No meaningful speed-up on this workload. Reported as measured.</div></div>
      <div class="abs tag" style="left:90px;top:840px">E1–E6 use synthetic clips with exact ground truth · eval/results/summary.md · bench/RESULTS.md</div>`;
  },
  update(r, lt, sc) {
    const a = sayAt(sc, "On twelve");
    r.querySelectorAll(".rb").forEach((b, i) => {
      const t0 = i === 2 ? sayAt(sc, "The fixed pipeline") : a + i * .5, k = prog(lt, t0, t0 + .9);
      b.style.width = (k * (+b.dataset.v / 12) * 760) + "px";
      const l = b.parentElement.querySelector(".rl"); l.style.left = (k * (+b.dataset.v / 12) * 760 + 20) + "px"; l.style.opacity = k;
    });
    show($("#t1", r), prog(lt, sayAt(sc, "Median"), sayAt(sc, "Median") + .5));
    show($("#t2", r), prog(lt, sayAt(sc, "Median") + .6, sayAt(sc, "Median") + 1.1));
    show($("#t3", r), prog(lt, sayAt(sc, "Median") + 1.2, sayAt(sc, "Median") + 1.7));
    show($("#t4", r), prog(lt, sayAt(sc, "We also ran"), sayAt(sc, "We also ran") + .5));
  },
};

S.close = {
  build(r) {
    r.innerHTML = `
      <div class="fill" id="cl1">
        <div class="abs h2" style="left:120px;top:150px">Honest about its limits</div>
        <div class="abs" style="left:120px;top:280px;display:flex;flex-direction:column;gap:22px">
          ${["Indicative, camera-based measurement. Not a certified ISO assessment.", "Frequency is valid only up to half the capture frame rate.", "Compression, low texture and lighting flicker can mask or fake sub-pixel motion.", "A first screen: confirm with a contact accelerometer before acting."].map((x) => `<div class="card lim" style="padding:22px 30px;font-size:32px;opacity:0">${x}</div>`).join("")}
        </div></div>
      <div class="fill" id="cl2" style="opacity:0">
        <svg class="wave" width="900" height="140" viewBox="0 0 900 140" style="top:220px"><path id="clW" fill="none" stroke="#f5b400" stroke-width="6" stroke-linecap="round"/></svg>
        <div class="logo" style="top:380px">HumSight</div>
        <div class="tagline" style="top:560px">See what machines are humming.</div>
        <div class="abs" style="left:0;right:0;top:680px;text-align:center;font-size:40px;font-weight:700;color:#fff">santiwari07.github.io/HumSight</div>
        <div class="abs" style="left:0;right:0;top:745px;text-align:center;font-size:30px;color:var(--ink2)">github.com/SanTiwari07/HumSight</div>
        <div class="foot" style="bottom:150px">OpenCV 5 · AWS Lambda (arm64) · S3 · SSM · CloudWatch · COOL on Graviton4 · OpenCV AI Competition 2026</div>
      </div>`;
  },
  update(r, lt, sc) {
    r.querySelectorAll(".lim").forEach((n, i) => show(n, prog(lt, .6 + i * .45, 1.1 + i * .45)));
    const e = sayAt(sc, "See what your");
    $("#cl1", r).style.opacity = 1 - prog(lt, e - .3, e + .2); $("#cl2", r).style.opacity = prog(lt, e - .2, e + .4);
    let d = ""; for (let x = 0; x <= 900; x += 6) { const env = Math.exp(-Math.pow((x - 450) / 230, 2)); d += (x ? "L" : "M") + x + " " + (70 + Math.sin(x / 18 - lt * 6) * 52 * env).toFixed(1); }
    $("#clW", r).setAttribute("d", d);
  },
};

// ------------------------------------------------------------------ engine
const roots = {};
for (const sc of T.scenes) {
  const r = document.createElement("section"); r.className = "scene" + (S[sc.id].rec ? " rec" : ""); r.id = "sc_" + sc.id;
  stage.insertBefore(r, $("#chapter")); S[sc.id].build(r, sc); roots[sc.id] = r;
}
const XF = .45; // crossfade
async function render(t) {
  const waits = [];
  let idx = T.scenes.findIndex((s) => t >= s.start && t < s.start + s.dur); if (idx < 0) idx = T.scenes.length - 1;
  const sc = T.scenes[idx], nx = T.scenes[idx + 1];
  for (const s of T.scenes) roots[s.id].style.display = "none";
  const draw = (s, op) => { const r = roots[s.id]; r.style.display = "block"; r.style.opacity = op; r.style.zIndex = op < 1 ? 2 : 1; S[s.id].update(r, t - s.start, s, waits); };
  draw(sc, 1);
  if (nx && t > nx.start - XF) draw(nx, clamp((t - (nx.start - XF)) / XF));
  // chrome
  const lt = t - sc.start;
  const cap = sc.captions.find((c) => lt >= c.t0 && lt < c.t1 + .15);
  $("#cap").textContent = cap ? cap.text : ""; $("#cap").style.opacity = cap ? 1 : 0;
  $("#chapter").innerHTML = sc.chapter ? sc.chapter.replace(/^(\d+) ·/, "<b>$1</b> ·") : ""; $("#chapter").style.opacity = sc.chapter ? 1 : 0;
  const onRec = !!S[sc.id].rec, ch = $("#chapter");
  ch.style.left = onRec ? "50%" : "48px"; ch.style.top = onRec ? "14px" : "40px"; ch.style.transform = onRec ? "translateX(-50%)" : "none";
  $("#brand").style.opacity = ["cold", "title", "close"].includes(sc.id) || onRec ? 0 : 1;
  $("#prog").style.width = (t / T.total * 100) + "%";
  $("#fade").style.opacity = Math.max(1 - clamp(t / .6), clamp((t - (T.total - 1.2)) / 1.2));
  await Promise.all(waits);
  if (document.fonts) await document.fonts.ready;
}
window.render = render; window.TOTAL = T.total;

// ------------------------------------------------------------------ interactive player
const isRender = /render=1/.test(location.search);
if (isRender) document.body.classList.add("render");
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `scale(${s})`; }
addEventListener("resize", fit); fit();
if (!isRender) {
  const aud = $("#aud"), pp = $("#pp"), sb = $("#scrub"), jump = $("#jump");
  T.scenes.forEach((s) => { const o = document.createElement("option"); o.value = s.start; o.textContent = `${fmt(s.start)}  ${s.chapter || s.id}`; jump.appendChild(o); });
  let playing = false, t0 = 0, w0 = 0, cur = 0;
  const now = () => (playing ? (aud.readyState > 1 && !aud.paused ? aud.currentTime : w0 + (performance.now() - t0) / 1000) : cur);
  function seek(t) { cur = clamp(t, 0, T.total); aud.currentTime = cur; w0 = cur; t0 = performance.now(); render(cur); }
  pp.onclick = () => { playing = !playing; pp.textContent = playing ? "Pause" : "Play"; if (playing) { w0 = cur; t0 = performance.now(); aud.currentTime = cur; aud.play().catch(() => {}); } else { cur = now(); aud.pause(); } };
  sb.oninput = () => seek(sb.value / 1000 * T.total);
  jump.onchange = () => seek(+jump.value);
  (function loop() { if (playing) { cur = now(); if (cur >= T.total) { playing = false; pp.textContent = "Play"; } render(cur); sb.value = cur / T.total * 1000; $("#clock").textContent = fmt(cur); } requestAnimationFrame(loop); })();
  render(0);
}
</script>
</body>
</html>
